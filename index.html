<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mohamed Amin | Digital Business Card</title>

<style>
:root {
    --orange: #DA5D37;
    --gold: #EBB43E;
    --cream: #F1E1BC;
    --teal: #1F6174;
    --sage: #73A899;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #1F6174, #164B5A);
    color: var(--cream);
}

.card {
    width: 100%;
    max-width: 430px;
    overflow: hidden;
    border-radius: 28px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(241,225,188,0.25);
    box-shadow: 0 25px 60px rgba(0,0,0,0.30);
}

.header {
    padding: 35px 30px 28px;
}

.institute {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--gold);
    font-weight: bold;
}

.name {
    margin: 10px 0 5px;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: .5px;
}

.position {
    font-size: 15px;
    font-weight: bold;
    color: white;
}

.department {
    margin-top: 7px;
    font-size: 13px;
    color: var(--cream);
}

.accent {
    height: 5px;
    background: linear-gradient(
        90deg,
        var(--orange),
        var(--gold),
        var(--sage)
    );
}

.info {
    background: var(--cream);
    color: var(--teal);
    padding: 22px 28px 10px;
}

.item {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 11px 0;
    border-bottom: 1px solid rgba(31,97,116,.15);
}

.item:last-child {
    border-bottom: none;
}

.icon {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    background: var(--teal);
    color: var(--cream);
    font-size: 14px;
}

.label {
    display: block;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1px;
    opacity: .6;
    margin-bottom: 3px;
}

.value,
.value a {
    color: var(--teal);
    text-decoration: none;
    font-size: 14px;
    line-height: 1.45;
    word-break: break-word;
}

.actions {
    background: var(--cream);
    padding: 20px 28px 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.button {
    min-height: 46px;
    border-radius: 13px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
}

.call {
    background: var(--orange);
    color: white;
}

.email {
    background: var(--teal);
    color: var(--cream);
}

.website {
    grid-column: 1 / -1;
    background: var(--gold);
    color: var(--teal);
}

.footer {
    text-align: center;
    padding: 13px;
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(241,225,188,.65);
}
</style>
</head>

<body>

<div class="card">

    <div class="header">

        <div class="institute">
            OSIM HIGHER INSTITUTE
        </div>

        <div class="name">
            MOHAMED AMIN
        </div>

        <div class="position">
            LIBRARY ADMINISTRATOR
        </div>

        <div class="department">
            LIBRARY
        </div>

    </div>

    <div class="accent"></div>

    <div class="info">

        <div class="item">
            <div class="icon">☎</div>
            <div>
                <span class="label">PHONE</span>
                <a class="value" href="tel:+201557548852">
                    01557548852
                </a>
            </div>
        </div>

        <div class="item">
            <div class="icon">✉</div>
            <div>
                <span class="label">EMAIL</span>
                <a class="value"
                   href="mailto:MOHAMED.AMIN@OHI-EGY.EDU.EG">
                    MOHAMED.AMIN@OHI-EGY.EDU.EG
                </a>
            </div>
        </div>

        <div class="item">
            <div class="icon">◎</div>
            <div>
                <span class="label">WEBSITE</span>
                <a class="value"
                   href="https://OHI-EGY.EDU.EG"
                   target="_blank">
                    OHI-EGY.EDU.EG
                </a>
            </div>
        </div>

        <div class="item">
            <div class="icon">⌖</div>
            <div>
                <span class="label">ADDRESS</span>
                <span class="value">
                    كورنيش النيل – طريق الوراق المناشي – بجوار شركة كهرباء غرب القاهرة
                </span>
            </div>
        </div>

    </div>

    <div class="actions">

        <a class="button call"
           href="tel:+201557548852">
            CALL
        </a>

        <a class="button email"
           href="mailto:MOHAMED.AMIN@OHI-EGY.EDU.EG">
            EMAIL
        </a>

        <a class="button website"
           href="https://OHI-EGY.EDU.EG"
           target="_blank">
            VISIT WEBSITE
        </a>

    </div>

    <div class="footer">
        DIGITAL BUSINESS CARD · LIBRARY
    </div>

</div>

</body>
</html>
